--- Hypertext ---
a text beyond normal
normal text can only be understood by us/humans
hypertext can be understood by a document/browser too through links

--- Markup ---

eg     Welcome (Browser does not know whether it's a heading/para/list/button)
   <h1>Welcome</h1>

--- Website --- 

A website is a collection of multiple webpages connected through hyperlinks.
eg: Home, About Us, Contact Us, Services

--- Webpage ---

A webpage is a single HTML document displayed inside a browser.
eg: index.html, services.html, home.html

--- Browser --- 
A browser is software that reads HTML, CSS, and JavaScript and displays webpages.
eg: Chrome, Firefox, Brave


--- Tags n Elements --- 
Tag: single keyword in angular bracket (also known as label)
eg: <h1> -> opning tag 
</h1> -> closing tag

Types of tags:     
1. Container Tags: elements with both open n closing tags. eg: <a>, <p>                                       
2. Closing Tags: elements that do not need closing tags.
eg: <br> (line break), <hr> (horizontal line), <img>, <input>


Element: opening tag + content + closing tags 
eg: <h1>I love HTML</h1>
    <p> this is an element</p>

Q. Why do we need element or even tags?


--- BoilerPlate Explanation --- 

<!DOCTYPE html> : Declares that the document is written in HTML5. (**Not a tag)
<html>          : Root element of the webpage. Everything is in this tag.
<head>          : Contains information about the webpage, not the webpage content. eg: title, meta tags, CSS files etc.
<title>         : Specifies the title shown on the browser tab.
<body>          : Contains everything visible to the user. eg: para, text, img, headings...etc
