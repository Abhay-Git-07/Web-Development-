<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Images</title>
  </head>

  <body>
    <h1>Working with Images</h1>

    <hr />

    <!-- Basic Image -->
    <img src="img.jpg" alt="Beautiful Nature" />

    <br /><br />

    <!-- Image with Width and Height -->
    <img src="" alt="Laptop" width="300" height="200" />

    <br /><br />

    <!-- Image with Tooltip -->
    <img src="img.jpg" alt="Nature" title="Beautiful Nature" />

    <br /><br />

    <!-- Clickable Image -->
    <a href="https://www.google.com">
      <img src="img.jpg" alt="Laptop Image" width="200" />
    </a>
  </body>
</html>
