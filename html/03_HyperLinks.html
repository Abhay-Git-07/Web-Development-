<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Hyperlinks</title>
  </head>

  <body>
    <h1>HTML Hyperlinks</h1>

    <hr />

    <!-- External Website -->
    <a href="https://www.google.com"> Visit Google </a>

    <br /><br />

    <!-- Opens in a new tab -->
    <a href="https://www.youtube.com" target="_blank"> Open YouTube </a>

    <br /><br />

    <!-- Tooltip -->
    <a href="https://github.com" title="Go to GitHub"> GitHub </a>

    <br /><br />

    <!-- Email Link -->
    <a href="mailto:abc@gmail.com"> Send Email </a>

    <br /><br />

    <!-- Phone Number -->
    <a href="tel:+911234567890"> Call Now </a>

    <br /><br />

    <!-- Download -->
    <a href="sample.pdf" download> Download PDF </a>
  </body>
</html>
