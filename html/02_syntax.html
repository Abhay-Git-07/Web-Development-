<!-- Syntax/Basic Structure -->

<!doctype html>
<!-- Declares this document as HTML5 -->

<html lang="en">
  <!-- Root element of the webpage -->

  <head>
    <!-- Character encoding -->
    <meta charset="UTF-8" />

    <!-- Makes the webpage responsive on different screen sizes -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title displayed on the browser tab -->
    <title>HTML Basics</title>
  </head>

  <body>
    <!-- Main heading -->
    <h1>Welcome to HTML</h1>

    <!-- Paragraph -->
    <p>This is my first HTML webpage.</p>
  </body>
</html>
